    <span class="cap">Нейросети</span>
  </button>
  <button type="button" class="dest">
    <span class="ink" aria-hidden="true"><svg viewBox="0 0 38 34"><path d="m18.8 1.6 3.8 2.7 5.3-.6 1.7 4.3 4.7 2.1-.4 4.6 2.6 4-3.2 3.6-.4 4.7-5 .9-2.8 3.9-5.2-1.5-4.7 2-3.8-3.3-5.2-.3-1.3-4.5-3.8-2.9 1.5-4.3-1.5-4.5 4-2.8 1.2-4.7 5.2-.3Z" class="cut" fill="#f5dc73"/></svg><svg class="brand-glyph" viewBox="86 98 482 465" aria-hidden="true"><defs><mask id="chappy-mark" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="640"><image href="img/8420d4d8.jpg" width="640" height="640"/></mask></defs><rect width="640" height="640" fill="currentColor" mask="url(#chappy-mark)"/></svg></span>

    <span class="cap">Профиль</span>
  </button>
</nav></footer></div>
<script>
const items=[
 {k:'kino',type:'Фото',title:'Кинопортрет',src:'img/kino.jpg',alt:'Кинопортрет мужчины на вечерней улице',price:'13 кр'},
 {k:'neon',type:'Фото',title:'Неоновый дождь',src:'img/neon.jpg',alt:'Портрет в розовом и синем неоновом свете',price:'5 кр'},
 {k:'fashion',type:'Фото',title:'Алое платье',src:'img/fashion.jpg',alt:'Девушка в алом платье',price:'13 кр'},
 {k:'motion',type:'Видео',title:'Оживить фото',src:'img/motion.jpg',video:'img/clip-spin.mp4',alt:'Портрет девушки в соборе, волосы развеваются',price:'от 23 кр',pos:'50% 25%'},
 {k:'future',type:'Видео',title:'Город будущего',src:'img/future.jpg',alt:'Город будущего',price:'159 кр'},
 {k:'song',type:'Песни',title:'Песня в подарок',src:'img/clip-church-poster.jpg',video:'img/clip-church.mp4',alt:'Девушка поёт в соборе со свечами',price:'23 кр',pos:'55% 30%'}];
const N=items.length,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const ICON={'Фото':'<path d="M1 1h14v12H1zM2 11l4-4 3 2 2-3 3 4"/><circle cx="5" cy="4.5" r=".9" fill="currentColor"/>','Видео':'<path d="M1 2h14v10H1z"/><path d="m6.5 4.6 4 2.4-4 2.4Z" fill="currentColor"/>','Песни':'<path d="M6 10.5V2l7-1.2v8.4"/><circle cx="4.3" cy="10.6" r="1.8" fill="currentColor"/><circle cx="11.3" cy="9.4" r="1.8" fill="currentColor"/>'};
const el=id=>document.getElementById(id),stage=el('tc-stage'),segs=el('tc-segs'),create=el('create'),hint=el('tc-hint');
let cur=0,busy=false,hinted=false,drag=null;
const cards=items.map((it,i)=>{
 const c=document.createElement('article');c.className='tc-card';c.dataset.k=it.k;c.setAttribute('role','group');c.setAttribute('aria-label',it.title+', '+(i+1)+' из '+N);
 const media=it.video?'<video muted playsinline loop autoplay preload="auto" poster="'+it.src+'" src="'+it.video+'" aria-label="'+it.alt+'" style="object-position:'+it.pos+'"></video>':'<img draggable="false" alt="'+it.alt+'" src="'+it.src+'">';
 c.innerHTML='<div class="tc-pic">'+media+'</div><span class="tc-tag">В тренде</span><span class="tc-type"><svg viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[it.type]+'</svg>'+it.type+'</span>'+(it.video?'<span class="tc-mute" role="img" aria-label="Звук выключен"><svg viewBox="0 0 20 18" fill="none" stroke="#29262a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5h3L10 2.8v12.4L5.5 11.5h-3Z" fill="#f5dc73"/><path d="m13.5 6.5 4.5 5m0-5-4.5 5"/></svg></span>':'')+'<h2 class="tc-cap">'+it.title+'</h2>';
 stage.append(c);return c});
const vids=cards.map(c=>c.querySelector('video'));vids.forEach(v=>v&&(v.muted=true));
items.forEach((it,i)=>{const s=document.createElement('button');s.type='button';s.className='tc-seg';s.setAttribute('aria-label',it.title);s.innerHTML='<i></i>';s.onclick=()=>go(i);segs.append(s)});
function restartBar(){[...segs.children].forEach((s,i)=>{s.classList.remove('cur');s.classList.toggle('past',i<cur)});void segs.offsetWidth;segs.children[cur].classList.add('cur')}
function layout(){
 cards.forEach((c,i)=>{const p=(i-cur+N)%N;c.dataset.pos=Math.min(p,3);c.setAttribute('aria-hidden',p!==0);
  const v=vids[i];if(v){if(p===0&&!reduce){const r=v.play();r&&r.catch(()=>{})}else{v.pause();if(p!==0)try{v.currentTime=0}catch(e){}}}});
 const it=items[cur];el('price').textContent=it.price;create.href=it.type==='Песни'?'../sk-home-create/song.html':'../sk-home-create/photo.html';
 create.setAttribute('aria-label','Создать, '+it.title+', '+it.price);restartBar();
}
function used(){if(hinted)return;hinted=true;hint.classList.add('off')}
function clear(c){c.style.transition='none';c.style.transform='';c.style.opacity='';void c.offsetWidth;c.style.transition=''}
function advance(sign){
 if(busy)return;busy=true;used();const c=cards[cur];
 c.style.transition='transform .34s cubic-bezier(.45,0,.85,.45),opacity .34s ease-in';
 c.style.transform='translate('+sign*460+'px,36px) rotate('+sign*24+'deg)';c.style.opacity='0';
 cur=(cur+1)%N;layout();setTimeout(()=>{clear(c);busy=false},360);
}
function back(){
 if(busy)return;busy=true;used();cur=(cur-1+N)%N;const c=cards[cur];
 c.style.transition='none';c.style.transform='translate(-460px,36px) rotate(-24deg)';c.style.opacity='0';layout();void c.offsetWidth;
 c.style.transition='transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s';c.style.transform='';c.style.opacity='';setTimeout(()=>{clear(c);busy=false},420);
}
function go(i){if(busy||i===cur)return;used();cur=i;layout()}
/* касания, мышь */
stage.addEventListener('pointerdown',e=>{if(busy||e.button>0)return;const c=cards[cur];if(!c.contains(e.target))return;
 drag={x:e.clientX,y:e.clientY,t:e.timeStamp,dx:0,on:false,id:e.pointerId};stage.classList.add('hold')});
stage.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.on){if(Math.abs(dx)<7||Math.abs(dx)<Math.abs(dy))return;drag.on=true;try{stage.setPointerCapture(e.pointerId)}catch(_){}}
 drag.dx=dx;const c=cards[cur];c.style.transition='none';c.style.transform='translate('+dx+'px,'+(dy*.25)+'px) rotate('+dx/16+'deg)'});
function release(e,cancel){if(!drag)return;const d=drag;drag=null;stage.classList.remove('hold');if(!d.on)return;
 const v=Math.abs(d.dx)/Math.max(1,e.timeStamp-d.t);
 if(!cancel&&(Math.abs(d.dx)>70||(Math.abs(d.dx)>28&&v>.45))){advance(d.dx<0?-1:1)}
 else{const c=cards[cur];c.style.transition='transform .3s cubic-bezier(.2,.8,.2,1)';c.style.transform='';setTimeout(()=>{if(!busy)clear(c)},320)}}
stage.addEventListener('pointerup',e=>release(e,false));stage.addEventListener('pointercancel',e=>release(e,true));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();advance(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();back()}});
document.addEventListener('visibilitychange',()=>stage.classList.toggle('hold',document.hidden));
/* автосмена: шкала времени сама зовёт advance */
segs.addEventListener('animationend',e=>{if(e.animationName==='tc-fill'&&!reduce&&!drag)advance(-1)});
document.querySelectorAll('.pin[data-go]').forEach(b=>b.onclick=()=>go(items.findIndex(x=>x.k===b.dataset.go)));
layout();
if(!reduce)setTimeout(()=>{if(hinted||drag)return;const c=cards[cur];c.classList.add('wig');c.addEventListener('animationend',()=>c.classList.remove('wig'),{once:true})},1500);
</script><script>(()=>{const n=+new URLSearchParams(location.search).get('tab');const d=[...document.querySelectorAll('.newdock .dest')];d.forEach((b,i)=>{b.onclick=()=>d.forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'))});if(d[n])d[n].click()})()</script></body></html>
