<script>
(()=>{
const T=[
 {k:'motion',n:'Оживить фото',t:'Видео',price:'от 23 кр',go:'photo',pair:true,vid:'img/clip-spin.mp4',poster:'img/clip-spin-poster.jpg',pos:'50% 18%',alt:'Девушка в соборе, фото оживает'},
 {k:'kino',n:'Кинопортрет',t:'Фото',price:'13 кр',go:'photo',img:'img/kino.jpg',pos:'50% 22%',alt:'Кинопортрет мужчины на вечерней улице'},
 {k:'neon',n:'Неоновый дождь',t:'Фото',price:'5 кр',go:'photo',img:'img/neon.jpg',pos:'50% 38%',alt:'Портрет в розовом и синем неоновом свете'},
 {k:'fashion',n:'Алое платье',t:'Фото',price:'13 кр',go:'photo',img:'img/fashion.jpg',pos:'50% 12%',alt:'Девушка в алом платье'},
 {k:'future',n:'Город будущего',t:'Видео',price:'159 кр',go:'photo',img:'img/future.jpg',pos:'50% 40%',alt:'Город будущего'},
 {k:'song',n:'Песня в подарок',t:'Песня',price:'23 кр',go:'song',vid:'img/clip-sing.mp4',poster:'img/clip-sing-poster.jpg',pos:'50% 22%',alt:'Девушка поёт в соборе'}
];
const $=id=>document.getElementById(id);
const stage=$('stage'),after=$('after'),reel=$('reel'),scale=$('scale'),grab=$('grab');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPK='<svg viewBox="0 0 16 14" fill="none" stroke="#29262a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 5v4h3l4 3V2l-4 3Z"/><path d="m11.5 4.5 3.5 5m0-5-3.5 5"/></svg>';
const PIC='<svg viewBox="0 0 16 14" fill="none" stroke="#29262a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1.5h14v11H1zM2 11l4-4 3 2 2-3 3 4"/></svg>';
let cur=-1,touched=false,dragging=false,sweepOn=false,t0=performance.now();
const media=[],dots=[];
T.forEach((d,i)=>{
 let m;
 if(d.vid){m=document.createElement('video');m.src=d.vid;m.poster=d.poster;m.muted=true;m.defaultMuted=true;m.loop=true;m.playsInline=true;m.autoplay=true;m.preload='auto';m.setAttribute('muted','');m.setAttribute('playsinline','');m.setAttribute('aria-label',d.alt);}
 else{m=document.createElement('img');m.src=d.img;m.alt=d.alt;m.draggable=false;}
 m.className='tb-m';m.style.objectPosition=d.pos;after.append(m);media.push(m);
 const b=document.createElement('button');b.type='button';b.className='tb-dot';b.setAttribute('role','tab');b.setAttribute('aria-label',d.n+', '+d.price);
 b.innerHTML='<img src="'+(d.vid?d.poster:d.img)+'" alt="" draggable="false" style="object-position:'+(d.k==='fashion'?'50% 12%':d.k==='future'?'50% 45%':d.vid?'50% 22%':d.pos)+'">';
 b.onclick=()=>show(i,true);reel.append(b);dots.push(b);
 const s=document.createElement('i');scale.append(s);
});
function setP(p){p=Math.max(4,Math.min(96,p));stage.style.setProperty('--p',p+'%');grab.setAttribute('aria-valuenow',Math.round(p))}
function curP(){return parseFloat(getComputedStyle(stage).getPropertyValue('--p'))||50}
function show(i,user){
 const n=T.length;i=(i+n)%n;if(i===cur)return;const d=T[i];cur=i;
 stage.classList.toggle('is-pair',!!d.pair);
 media.forEach((m,j)=>{m.classList.toggle('on',j===i);if(m.tagName==='VIDEO'){if(j===i&&!calm){m.currentTime=0;const p=m.play();p&&p.catch(()=>{})}else m.pause()}});
 dots.forEach((b,j)=>{b.setAttribute('aria-selected',String(j===i))});
 [...scale.children].forEach((s,j)=>s.classList.toggle('on',j<=i));
 $('tag-now').textContent=d.pair?'Стало':'Пример';
 const nm=$('name');nm.classList.add('out');
 setTimeout(()=>{nm.textContent=d.n;nm.classList.remove('out')},calm?0:140);
 $('kind').innerHTML=(d.vid||d.t==='Видео'?SPK:PIC)+'<span>'+d.t+'</span>';
 $('price').textContent=d.price;$('create').href=d.go==='song'?'../sk-home-create/song.html':'../sk-home-create/photo.html';
 const b=dots[i];reel.scrollTo({left:b.offsetLeft-(reel.clientWidth-b.offsetWidth)/2,behavior:calm||!user?'auto':'smooth'});
 if(d.pair&&!touched&&!calm)startSweep();
 if(user)endHint();
}
function endHint(){const h=$('hint');if(h)h.classList.add('gone')}
function startSweep(){if(sweepOn)return;sweepOn=true;t0=performance.now()-1250;
 (function f(now){if(!sweepOn)return;if(touched||dragging||!stage.classList.contains('is-pair')){sweepOn=false;return}
 setP(50+30*Math.sin((now-t0)/1700));requestAnimationFrame(f)})(performance.now())}
// ручка: тянуть пальцем и мышью
function pFrom(e){const r=stage.getBoundingClientRect();return (e.clientX-r.left)/r.width*100}
grab.addEventListener('pointerdown',e=>{dragging=true;touched=true;sweepOn=false;endHint();grab.setPointerCapture(e.pointerId);setP(pFrom(e));e.preventDefault()});
grab.addEventListener('pointermove',e=>{if(dragging)setP(pFrom(e))});
['pointerup','pointercancel'].forEach(ev=>grab.addEventListener(ev,()=>{dragging=false}));
grab.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){touched=true;sweepOn=false;endHint();setP(curP()+(e.key==='ArrowLeft'?-6:6));e.preventDefault();e.stopPropagation()}});
// листание трендов: свайп по кадру (вне ручки), стрелки, перетаскивание ряда мышью
let sx=null,sy=0,swiped=false;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.tb-grab')&&stage.classList.contains('is-pair'))return;sx=e.clientX;sy=e.clientY;swiped=false});
stage.addEventListener('pointermove',e=>{if(sx===null||swiped)return;const dx=e.clientX-sx;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(e.clientY-sy)*1.3){swiped=true;show(cur+(dx<0?1:-1),true);sx=null}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>stage.addEventListener(ev,()=>{sx=null}));
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('.tb-grab'))return;if(e.key==='ArrowRight'){show(cur+1,true)}else if(e.key==='ArrowLeft'){show(cur-1,true)}});
let md=null,msc=0,moved=false;
reel.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;md=e.clientX;msc=reel.scrollLeft;moved=false});
window.addEventListener('pointermove',e=>{if(md===null)return;const dx=e.clientX-md;if(Math.abs(dx)>4)moved=true;if(moved)reel.scrollLeft=msc-dx});
window.addEventListener('pointerup',()=>{md=null});
reel.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
// «Твои»
document.querySelectorAll('.tb-pin[data-go]').forEach(b=>b.onclick=()=>{const i=T.findIndex(d=>d.k===b.dataset.go);if(i>=0)show(i,true)});
const q=new URLSearchParams(location.search).get('show');const qi=T.findIndex(d=>d.k===q);
show(qi>=0?qi:0);
if(calm)setP(50);
window.__tb={show,get cur(){return cur},T};
})();
</script><script>(()=>{const n=+new URLSearchParams(location.search).get('tab');const d=[...document.querySelectorAll('.newdock .dest')];d.forEach((b,i)=>{b.onclick=()=>d.forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'))});if(d[n])d[n].click()})()</script></body></html>
