<script>
(function(){
'use strict';
var KEY='chappy-assistant-chat-v1',MAXM=30,BAL=56;
var TRU=function(k){return '../sk-home/trend.html?t='+k+'#'+k};
var $=function(i){return document.getElementById(i)};
var feed=$('feed'),field=$('field'),form=$('form'),clip=$('clip'),newBox=$('new'),newB=$('newb');
var app=document.querySelector('.screen');
document.documentElement.classList.add('sc-root');app.classList.add('sc-app');
var st={m:[],mem:{}},busy=false,askT=0;
window.chatGo=function(u){location.href=u};

/* ---------- хранилище: всё в try/catch ---------- */
function load(){try{var raw=window.localStorage.getItem(KEY);if(!raw)return;var o=JSON.parse(raw);
 if(o&&Array.isArray(o.m))st.m=o.m.filter(function(x){return x&&(x.r==='u'||x.r==='a')}).slice(-MAXM);
 if(o&&o.mem&&typeof o.mem==='object')st.mem=o.mem}catch(e){}}
function save(){try{st.m=st.m.slice(-MAXM);window.localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function wipe(){try{window.localStorage.removeItem(KEY)}catch(e){}}

/* ---------- каталог: только из прочитанных экранов ---------- */
var PH=[
 {id:'kino',t:'Кинопортрет',n:13,img:'img/kino.jpg',pos:'58% 30%',kw:/кино/},
 {id:'fashion',t:'Алое платье',n:13,img:'img/fashion.jpg',pos:'50% 40%',kw:/алое|плать/},
 {id:'star',t:'Красная дорожка',n:13,img:'img/tr-star.jpg',pos:'55% 22%',kw:/красн|дорожк/},
 {id:'neon',t:'Неоновый дождь',n:5,img:'img/neon.jpg',pos:'50% 35%',kw:/неон|дожд/},
 {id:'anime',t:'Закатный ветер',n:5,img:'img/tr-anime.jpg',pos:'50% 22%',kw:/закат|аниме|ветер/},
 {id:'avatar',t:'Деловой портрет',n:13,img:'img/tr-avatar.jpg',pos:'50% 22%',kw:/аватар|делов|резюме/,lead:'Для аватарки — «Деловой портрет».'}];
var OT={
 video:{t:'Оживить фото',m:'Из твоего фото',pr:'от 23 кр',n:23,img:'img/clip-spin-poster.jpg',pos:'47% 50%',url:TRU('motion'),kind:'video'},
 dance:{t:'Ночной танец',m:'Из твоего фото',pr:'от 23 кр',n:23,img:'img/tr-dance.jpg',pos:'50% 25%',url:TRU('dance'),kind:'video'},
 spacecat:{t:'Кот в космосе',m:'Видео',pr:'от 23 кр',n:23,img:'img/clip-spacecat-poster.jpg',pos:'50% 30%',url:TRU('spacecat'),kind:'video'},
 video2:{t:'Оживить фото',m:'Grok Imagine 1.5',pr:'от 16 кр',n:16,img:'img/mira-1.jpg',pos:'50% 18%',url:'../sk-ai/ai-video.html',kind:'video'},
 song:{t:'Песня в подарок',m:'Песня',pr:'23 кр',n:23,img:'img/song.jpg',pos:'50% 30%',url:TRU('song'),kind:'song'},
 voice:{t:'Озвучка текста',m:'ElevenLabs',pr:'95 кр / 1000 зн.',n:95,icon:'voice',url:'../sk-ai-more/ai-sound.html',kind:'voice'}};
PH.forEach(function(p){OT[p.id]={t:p.t,m:'Фото-тренд',pr:p.n+' кр',n:p.n,img:p.img,pos:p.pos,url:TRU(p.id),kind:'photo'}});
var TXT_COST='Списано 8 кр · GPT-5.6 Luna';

/* ---------- разбор слов ---------- */
function norm(s){return String(s).toLowerCase().replace(/ё/g,'е')}
var REC=[
 [/(?<![а-я])мам(е|у|ы|очке|очку)(?![а-я])/,'маме','мама','Дорогая'],[/(?<![а-я])пап(е|у|ы|очке|очку)(?![а-я])/,'папе','папа','Дорогой'],
 [/(?<![а-я])бабушк(е|у|и)(?![а-я])/,'бабушке','бабушка','Дорогая'],[/(?<![а-я])дедушк(е|у|и)(?![а-я])/,'дедушке','дедушка','Дорогой'],
 [/(?<![а-я])сестр(е|у|ы)(?![а-я])/,'сестре','сестра','Дорогая'],[/(?<![а-я])брат(у|а)(?![а-я])/,'брату','брат','Дорогой'],
 [/(?<![а-я])подруг(е|у|и)(?![а-я])/,'подруге','подруга','Дорогая'],[/(?<![а-я])друг(у|а)(?![а-я])/,'другу','друг','Дорогой'],
 [/(?<![а-я])жен(е|у|ы)(?![а-я])/,'жене','жена','Любимая'],[/(?<![а-я])муж(у|а)(?![а-я])/,'мужу','муж','Любимый'],
 [/(?<![а-я])сын(у|а)(?![а-я])/,'сыну','сын','Дорогой'],[/(?<![а-я])(дочке|дочери|дочку|дочь)(?![а-я])/,'дочке','дочка','Дорогая'],
 [/(?<![а-я])учител(ю|я)(?![а-я])/,'учителю','учитель','Уважаемый'],[/(?<![а-я])коллег(е|у|и)(?![а-я])/,'коллеге','коллега','Дорогой']];
var OCC=[
 [/(день|дня|дню|днем)\s+рожден|днюх/,'на день рождения','С днём рождения!'],
 [/юбиле/,'на юбилей','С юбилеем!'],[/свадьб/,'на свадьбу','С днём свадьбы!'],
 [/годовщин/,'на годовщину','С годовщиной!'],[/8 марта/,'на 8 Марта','С 8 Марта!'],
 [/23 февраля/,'на 23 Февраля','С 23 Февраля!'],[/нов(ый|ым) год/,'на Новый год','С Новым годом!'],
 [/выпускн/,'на выпускной','С выпускным!']];
function parseWho(n){var o={},i,r;
 for(i=0;i<REC.length;i++){if(REC[i][0].test(n)){o.dat=REC[i][1];o.nom=REC[i][2];o.adj=REC[i][3];break}}
 for(i=0;i<OCC.length;i++){if(OCC[i][0].test(n)){o.occ=OCC[i][1];o.hello=OCC[i][2];break}}
 return(o.dat||o.occ)?o:null}
function whoLabel(w){if(!w)return'';return[w.dat,w.occ].filter(Boolean).join(' ')||w.raw||''}
function mergeWho(a,b){var o={},k;a=a||{};b=b||{};for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o}
function plural(n){var a=n%10,b=n%100;return(a===1&&b!==11)?'раз':(a>=2&&a<=4&&(b<10||b>=20))?'раза':'раз'}
function kindOf(n){
 if(/оживи|оживл|видео|ролик|анимир|анимаци|клип/.test(n))return'video';
 if(/озвуч|озвуч|голос|начитай/.test(n))return'voice';
 if(/поздравить|подарить/.test(n)&&!/текст|напиши|слов/.test(n))return'song';
 if(/песн|трек|мелоди|музык/.test(n))return'song';
 if(/поздрав|текст|подпис|(?<![а-я])пост|напиши|слоган|описани/.test(n))return'text';
 if(/фото|картин|портрет|снимок|изображен|стиль|стиле|тренд|аватар/.test(n))return'photo';
 return''}
function styleOf(n){for(var i=0;i<PH.length;i++){if(PH[i].kw.test(n))return PH[i]}return null}
function ph(id){for(var i=0;i<PH.length;i++){if(PH[i].id===id)return PH[i]}return null}

/* ---------- ответы ---------- */
var C3=['Поздравить близкого','Оживить старое фото','Сделать аватарку'];
function offerMsg(id,t,extra){var m=st.mem;m.last=id;m.seen=m.seen||[];if(m.seen.indexOf(id)<0)m.seen.push(id);m.ask=null;
 var o={r:'a',t:t,o:id};if(id==='song'&&m.who)o.w=whoLabel(m.who);if(extra)for(var k in extra)o[k]=extra[k];return o}
function photoOffer(p,lead){var m=st.mem;m.want='photo';m.style=p.id;
 return offerMsg(p.id,lead||p.lead||(m.photo?'Сделаю «'+p.t+'» из твоего фото.':'Вот подходящий тренд — «'+p.t+'».'))}
function askStyle(){var m=st.mem;m.want='photo';m.ask='style';return{r:'a',t:'Какой стиль? Вот три любимых.',ch:['Кинопортрет','Неоновый дождь','Алое платье']}}
function songReply(){var m=st.mem;m.want='song';var w=m.who;
 if(!w||!w.dat){m.ask='who';return{r:'a',t:w&&w.occ?'Для кого песня '+w.occ+'?':'Для кого и какой повод?',ch:['Маме на день рождения','Подруге на свадьбу','Папе на юбилей']}}
 var d=w.dat||'';return offerMsg('song',d?d.charAt(0).toUpperCase()+d.slice(1)+' — песню: её можно слушать снова и снова.':'Песню — её можно слушать снова и снова.')}
function videoReply(){var m=st.mem;m.want='video';
 if(!m.photo){m.ask='photo';return{r:'a',t:'Пришли фото — оживлю его. Скрепка слева.',ch:[{a:'clip',x:'Приложить фото'}]}}
 return offerMsg('video','Оживим твоё фото.')}
function voiceReply(){var m=st.mem;m.want='voice';return offerMsg('voice',m.last==='text'?'Озвучу текст выше.':'Озвучу любой текст голосом.')}
var CAP=['Свет, кадр и хорошее настроение.','Иногда достаточно одного кадра.','Сегодня — моё.'];
function textAsk(n,more){var m=st.mem;m.want='text';m.last='text';m.tq=n;m.tmore=!!more;
 return{r:'a',t:more?'Ещё вариант — снова 8 кр.':'Напишу — текст стоит 8 кр.',ch:[{a:'write',x:'Написать · 8 кр'}]}}
function textReply(n,more){var m=st.mem;m.want='text';m.tq=n;m.tv=more?((m.tv||0)+1)%3:(m.tv||0);var v=m.tv,w=m.who,p=[],cp;
 var topic=(n.match(/(?<![а-я])про\s+([^.,!?]{2,30})/)||[])[1];
 if(/подпис/.test(n)||(more&&m.tk==='cap')){m.tk='cap';p=[CAP[v]]}
 else if(/(?<![а-я])пост/.test(n)||(more&&m.tk==='post')){m.tk='post';if(topic)m.topic=topic.trim();var tp=m.topic;
  p=['Расскажем '+(tp?'про '+tp:'о главном')+'.',['Заходи сегодня — будем рады тебе.','Загляни к нам — всё самое интересное уже здесь.','Мы ждём тебя. Приходи и расскажи друзьям.'][v]]}
 else{m.tk='greet';var h=w&&w.hello?w.hello:'Поздравляю!';
  p=[(w&&w.nom?w.adj+' '+w.nom+'! ':'')+h,['Желаю, чтобы рядом были те, кто любит.','Пусть день будет тёплым, а мечты — ближе.','Тебе — тепло, а нам — повод собраться.'][v],['Спасибо, что ты есть.','Береги себя и улыбайся.','Пусть всё задуманное сбудется.'][v]]}
 cp=p.join('\n');m.last='text';m.ask=null;
 return{r:'a',t:p.join('\n'),cp:cp,cost:TXT_COST,post:1,ch:[{a:'again',x:'Ещё вариант · 8 кр'},'Озвучь это']}}
function priceReply(k){var m=st.mem,l=m.last,o=l&&OT[l],kd=k||(o&&o.kind)||(l==='text'?'text':m.want);
 var t;
 if(k&&o&&o.kind!==k&&!(k==='text'&&l==='text'))o=null;
 if(o){t=o.t+' — '+o.pr+'.';
  if(o.kind==='photo')t+=o.n>5?' Дешевле — тренды за 5 кр.':' Это самые доступные тренды.';
  else if(l==='video'||l==='dance')t+=' Дешевле — Grok Imagine 1.5, от 16 кр.';
  else if(l==='voice')t='Озвучка — 95 кр за 1000 знаков.'}
 else if(kd==='text'||(!k&&l==='text'))t='Текст — 8 кр, GPT-5.6 Luna.';
 else if(kd==='photo')t='Фото-тренды стоят от 5 до 13 кр.';
 else if(kd==='video')t='Оживить фото — от 23 кр, дешевле — от 16 кр.';
 else if(kd==='song')t='Песня в подарок — 23 кр.';
 else if(kd==='voice')t='Озвучка — 95 кр за 1000 знаков.';
 else return{r:'a',t:'Фото от 5 кр, песня 23 кр, видео от 23 кр. Что нужно?',ch:C3};

<script>
/* hw-kit: колесо дня в шапке (19.11.2026). Без зависимостей.
   Открывает окно #hw-sheet по клику на любой [data-wheel-open]; закрывает крестиком, нажатием мимо и Escape.
   Колесо доступно раз в сутки, новый день начинается в 00:00 по Москве (UTC+3, без перехода на летнее время).
   Состояние хранится в localStorage (ключ hw-wheel = «день:приз:забрал»); без него считаем, что колесо доступно.
   Призы — только те, что нарисованы на колесе (sk-profile/profile-spin.html), порядок по часовой от верха.
   Для проверки: window.HW_NOW (мс) подменяет «сейчас»; window.HW_PRIZE (0–7) выбирает сектор, по умолчанию +15. */
(function () {
  'use strict';
  if (window.ChappyWheel) return;
  var KEY = 'hw-wheel', MSK = 3 * 3600000, DAY = 86400000, SPIN_MS = 3600;
  var PRIZES = ['5 000', '+15', '+5', '+20', '+2', '+10', '+1', '+3'];
  var sheet = null, act, cap, prizeEl, rot, spinning = false, shown = '', opener = null, mem, timer = null, prevOverflow = '';

  function now() { return window.HW_NOW != null ? +window.HW_NOW : Date.now(); }
  function mskDay(t) { return Math.floor((t + MSK) / DAY); }
  function msLeft(t) { return (mskDay(t) + 1) * DAY - MSK - t; }
  function fmt(ms) {
    var m = Math.ceil(ms / 60000);
    if (m < 1) return 'меньше минуты';
    var h = Math.floor(m / 60), mm = m % 60;
    return h ? (mm ? h + ' ч ' + mm + ' мин' : h + ' ч') : mm + ' мин';
  }
  function left(t) { t = t == null ? now() : t; var ms = msLeft(t); return { ms: ms, text: fmt(ms) }; }
  function reduced() { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } }

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw == null) raw = mem == null ? null : mem;
    if (!raw) return null;
    var p = String(raw).split(':');
    if (+p[0] !== mskDay(now())) return null;
    var i = +p[1];
    return { idx: i >= 0 && i < PRIZES.length ? i : 1, taken: p[2] === '1' };
  }
  function save(rec) {
    var raw = rec ? mskDay(now()) + ':' + rec.idx + ':' + (rec.taken ? 1 : 0) : null;
    mem = raw;
    try { if (raw) localStorage.setItem(KEY, raw); else localStorage.removeItem(KEY); } catch (e) {}
  }
  function state() {
    if (spinning) return 'spin';
    var r = load();
    return r ? (r.taken ? 'spun' : 'win') : 'ready';
  }
  function pick() { var p = window.HW_PRIZE; return typeof p === 'number' && p >= 0 && p < PRIZES.length ? p | 0 : 1; }
  function angle(i) { return (360 - i * 45) % 360; }

  function icons(s) {
    var done = s === 'spun', list = document.querySelectorAll('.hw-wheel');
    for (var i = 0; i < list.length; i++) {
      list[i].classList.toggle('hw-done', done);
      list[i].setAttribute('aria-label', done ? 'Колесо дня: уже крутили' : 'Колесо дня: можно крутить');
    }
  }
  function setRot(deg, animate) {
    if (!rot) return;
    sheet.classList.remove('hw-spin');
    rot.style.transform = 'rotate(' + (animate ? 0 : deg) + 'deg)';
    if (animate) {
      void rot.getBoundingClientRect();
      sheet.classList.add('hw-spin');
      rot.style.transform = 'rotate(' + deg + 'deg)';
    }
  }
  function paint(s) {
    if (!sheet) return;
    var r = load(), t = left().text;
    sheet.setAttribute('data-st', s);
    if (s === 'ready') {
      cap.textContent = 'Раз в день'; act.textContent = 'Крутить'; act.setAttribute('aria-disabled', 'false');
      if (shown !== 'ready') setRot(0, false);
    } else if (s === 'spin') {
      cap.textContent = 'Крутится…'; act.textContent = 'Крутится'; act.setAttribute('aria-disabled', 'true');
    } else {
      var i = r ? r.idx : 1;
      prizeEl.textContent = PRIZES[i];
      cap.textContent = 'Следующее — через ' + t;
      act.textContent = s === 'win' ? 'Забрать' : 'Понятно';
      act.setAttribute('aria-disabled', 'false');
      if (shown !== s && shown !== 'spin') setRot(angle(i), false);
    }
    shown = s;
  }
  function sync() {
    var s = state();
    icons(s);
    if (s !== 'spin') paint(s);
  }

  function spin() {
    if (spinning || state() !== 'ready') return;
    var i = pick();
    save({ idx: i, taken: false });
    spinning = true;
    paint('spin');
    prizeEl.textContent = PRIZES[i];
    var fast = reduced();
    setRot(1800 + angle(i), !fast);
    if (fast) setRot(angle(i), false);
    setTimeout(function () { spinning = false; shown = 'spin'; sync(); focusMain(); }, fast ? 300 : SPIN_MS + 150);
  }
  function take() {
    var r = load();
    if (!r) return;
    save({ idx: r.idx, taken: true });
    sync();
    close();
  }
  function focusMain() {
    if (!isOpen()) return;
    var b = act.getAttribute('aria-disabled') === 'true' ? sheet.querySelector('.hw-x') : act;
    if (b && b.focus) b.focus();
  }
  function isOpen() { return !!sheet && !sheet.hidden && sheet.classList.contains('hw-on'); }

  function open() {
    if (!sheet || isOpen()) return;
    opener = document.activeElement;
    sync();
    sheet.hidden = false;
    void sheet.offsetWidth;
    sheet.classList.add('hw-on');
    prevOverflow = document.documentElement.style.overflow;
    document.documentElement.style.overflow = 'hidden';
    document.addEventListener('keydown', onKey, true);
    focusMain();
  }
  function close() {
    if (!isOpen()) return;
    sheet.classList.remove('hw-on');
    document.removeEventListener('keydown', onKey, true);
    document.documentElement.style.overflow = prevOverflow;
    var o = opener;
    function fin() { if (!sheet.classList.contains('hw-on')) sheet.hidden = true; }
    if (reduced()) fin(); else setTimeout(fin, 340);
    if (o && o.focus && document.contains(o)) { try { o.focus(); } catch (e) {} }
  }
  function onKey(e) {
    if (e.key === 'Escape' || e.key === 'Esc') { e.preventDefault(); close(); return; }
    if (e.key !== 'Tab') return;
    var f = [].slice.call(sheet.querySelectorAll('button')).filter(function (b) { return b.getAttribute('aria-disabled') !== 'true'; });
    if (!f.length) return;
    var a = document.activeElement, first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (a === first || !sheet.contains(a))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (a === last || !sheet.contains(a))) { e.preventDefault(); first.focus(); }
  }

  function init() {
    sheet = document.getElementById('hw-sheet');
    if (sheet) {
      act = document.getElementById('hw-act'); cap = document.getElementById('hw-cap');
      prizeEl = document.getElementById('hw-prize'); rot = document.getElementById('hw-rot');
      act.addEventListener('click', function () {
        var s = state();
        if (s === 'ready') spin(); else if (s === 'win') take(); else if (s === 'spun') close();
      });
    }
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var o = t.closest('[data-wheel-open]');
      if (o) { e.preventDefault(); open(); return; }
      if (t.closest('[data-hw-close]') && isOpen()) { e.preventDefault(); close(); }
    });
    window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === null) sync(); });
    timer = setInterval(sync, 15000);
    sync();
  }

  window.ChappyWheel = {
    open: open, close: close, state: state, left: left, sync: sync, isOpen: isOpen,
    prizes: PRIZES.slice(),
    store: function (rec) { save(rec); sync(); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
