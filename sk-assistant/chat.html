<script>
(function(){
'use strict';
var KEY='chappy-assistant-chat-v1',MAXM=30,BAL=56;
var TRU=function(k){return '../sk-home/trend.html?t='+k+'#'+k};
var $=function(i){return document.getElementById(i)};
var feed=$('feed'),field=$('field'),form=$('form'),clip=$('clip'),newBox=$('new'),newB=$('newb');
var app=document.querySelector('.screen');
document.documentElement.classList.add('sc-root');app.classList.add('sc-app');
var st={m:[],mem:{}},busy=false,askT=0;
window.chatGo=function(u){location.href=u};

/* ---------- хранилище: всё в try/catch ---------- */
function load(){try{var raw=window.localStorage.getItem(KEY);if(!raw)return;var o=JSON.parse(raw);
 if(o&&Array.isArray(o.m))st.m=o.m.filter(function(x){return x&&(x.r==='u'||x.r==='a')}).slice(-MAXM);
 if(o&&o.mem&&typeof o.mem==='object')st.mem=o.mem}catch(e){}}
function save(){try{st.m=st.m.slice(-MAXM);window.localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function wipe(){try{window.localStorage.removeItem(KEY)}catch(e){}}

/* ---------- каталог: только из прочитанных экранов ---------- */
var PH=[
 {id:'kino',t:'Кинопортрет',n:13,img:'img/kino.jpg',pos:'58% 30%',kw:/кино/},
 {id:'fashion',t:'Алое платье',n:13,img:'img/fashion.jpg',pos:'50% 40%',kw:/алое|плать/},
 {id:'star',t:'Красная дорожка',n:13,img:'img/tr-star.jpg',pos:'55% 22%',kw:/красн|дорожк/},
 {id:'neon',t:'Неоновый дождь',n:5,img:'img/neon.jpg',pos:'50% 35%',kw:/неон|дожд/},
 {id:'anime',t:'Закатный ветер',n:5,img:'img/tr-anime.jpg',pos:'50% 22%',kw:/закат|аниме|ветер/},
 {id:'avatar',t:'Деловой портрет',n:13,img:'img/tr-avatar.jpg',pos:'50% 22%',kw:/аватар|делов|резюме/,lead:'Для аватарки — «Деловой портрет».'}];
var OT={
 video:{t:'Оживить фото',m:'Из твоего фото',pr:'от 23 кр',n:23,img:'img/clip-spin-poster.jpg',pos:'47% 50%',url:TRU('motion'),kind:'video'},
 dance:{t:'Ночной танец',m:'Из твоего фото',pr:'от 23 кр',n:23,img:'img/tr-dance.jpg',pos:'50% 25%',url:TRU('dance'),kind:'video'},
 spacecat:{t:'Кот в космосе',m:'Видео',pr:'от 23 кр',n:23,img:'img/clip-spacecat-poster.jpg',pos:'50% 30%',url:TRU('spacecat'),kind:'video'},
 video2:{t:'Оживить фото',m:'Grok Imagine 1.5',pr:'от 16 кр',n:16,img:'img/mira-1.jpg',pos:'50% 18%',url:'../sk-ai/ai-video.html',kind:'video'},
 song:{t:'Песня в подарок',m:'Песня',pr:'23 кр',n:23,img:'img/song.jpg',pos:'50% 30%',url:TRU('song'),kind:'song'},
 voice:{t:'Озвучка текста',m:'ElevenLabs',pr:'95 кр / 1000 зн.',n:95,icon:'voice',url:'../sk-ai-more/ai-sound.html',kind:'voice'}};
PH.forEach(function(p){OT[p.id]={t:p.t,m:'Фото-тренд',pr:p.n+' кр',n:p.n,img:p.img,pos:p.pos,url:TRU(p.id),kind:'photo'}});
var TXT_COST='Списано 8 кр · GPT-5.6 Luna';

/* ---------- разбор слов ---------- */
function norm(s){return String(s).toLowerCase().replace(/ё/g,'е')}
var REC=[
 [/(?<![а-я])мам(е|у|ы|очке|очку)(?![а-я])/,'маме','мама','Дорогая'],[/(?<![а-я])пап(е|у|ы|очке|очку)(?![а-я])/,'папе','папа','Дорогой'],
 [/(?<![а-я])бабушк(е|у|и)(?![а-я])/,'бабушке','бабушка','Дорогая'],[/(?<![а-я])дедушк(е|у|и)(?![а-я])/,'дедушке','дедушка','Дорогой'],
 [/(?<![а-я])сестр(е|у|ы)(?![а-я])/,'сестре','сестра','Дорогая'],[/(?<![а-я])брат(у|а)(?![а-я])/,'брату','брат','Дорогой'],
 [/(?<![а-я])подруг(е|у|и)(?![а-я])/,'подруге','подруга','Дорогая'],[/(?<![а-я])друг(у|а)(?![а-я])/,'другу','друг','Дорогой'],
 [/(?<![а-я])жен(е|у|ы)(?![а-я])/,'жене','жена','Любимая'],[/(?<![а-я])муж(у|а)(?![а-я])/,'мужу','муж','Любимый'],
 [/(?<![а-я])сын(у|а)(?![а-я])/,'сыну','сын','Дорогой'],[/(?<![а-я])(дочке|дочери|дочку|дочь)(?![а-я])/,'дочке','дочка','Дорогая'],
 [/(?<![а-я])учител(ю|я)(?![а-я])/,'учителю','учитель','Уважаемый'],[/(?<![а-я])коллег(е|у|и)(?![а-я])/,'коллеге','коллега','Дорогой']];
var OCC=[
 [/(день|дня|дню|днем)\s+рожден|днюх/,'на день рождения','С днём рождения!'],
 [/юбиле/,'на юбилей','С юбилеем!'],[/свадьб/,'на свадьбу','С днём свадьбы!'],
 [/годовщин/,'на годовщину','С годовщиной!'],[/8 марта/,'на 8 Марта','С 8 Марта!'],
 [/23 февраля/,'на 23 Февраля','С 23 Февраля!'],[/нов(ый|ым) год/,'на Новый год','С Новым годом!'],
 [/выпускн/,'на выпускной','С выпускным!']];
function parseWho(n){var o={},i,r;
 for(i=0;i<REC.length;i++){if(REC[i][0].test(n)){o.dat=REC[i][1];o.nom=REC[i][2];o.adj=REC[i][3];break}}
 for(i=0;i<OCC.length;i++){if(OCC[i][0].test(n)){o.occ=OCC[i][1];o.hello=OCC[i][2];break}}
 return(o.dat||o.occ)?o:null}
function whoLabel(w){if(!w)return'';return[w.dat,w.occ].filter(Boolean).join(' ')||w.raw||''}
function mergeWho(a,b){var o={},k;a=a||{};b=b||{};for(k in a)o[k]=a[k];for(k in b)o[k]=b[k];return o}
function plural(n){var a=n%10,b=n%100;return(a===1&&b!==11)?'раз':(a>=2&&a<=4&&(b<10||b>=20))?'раза':'раз'}
function kindOf(n){
 if(/оживи|оживл|видео|ролик|анимир|анимаци|клип/.test(n))return'video';
 if(/озвуч|озвуч|голос|начитай/.test(n))return'voice';
 if(/поздравить|подарить/.test(n)&&!/текст|напиши|слов/.test(n))return'song';
 if(/песн|трек|мелоди|музык/.test(n))return'song';
 if(/поздрав|текст|подпис|(?<![а-я])пост|напиши|слоган|описани/.test(n))return'text';
 if(/фото|картин|портрет|снимок|изображен|стиль|стиле|тренд|аватар/.test(n))return'photo';
 return''}
function styleOf(n){for(var i=0;i<PH.length;i++){if(PH[i].kw.test(n))return PH[i]}return null}
function ph(id){for(var i=0;i<PH.length;i++){if(PH[i].id===id)return PH[i]}return null}

/* ---------- ответы ---------- */
var C3=['Поздравить близкого','Оживить старое фото','Сделать аватарку'];
function offerMsg(id,t,extra){var m=st.mem;m.last=id;m.seen=m.seen||[];if(m.seen.indexOf(id)<0)m.seen.push(id);m.ask=null;
 var o={r:'a',t:t,o:id};if(id==='song'&&m.who)o.w=whoLabel(m.who);if(extra)for(var k in extra)o[k]=extra[k];return o}
function photoOffer(p,lead){var m=st.mem;m.want='photo';m.style=p.id;
 return offerMsg(p.id,lead||p.lead||(m.photo?'Сделаю «'+p.t+'» из твоего фото.':'Вот подходящий тренд — «'+p.t+'».'))}
function askStyle(){var m=st.mem;m.want='photo';m.ask='style';return{r:'a',t:'Какой стиль? Вот три любимых.',ch:['Кинопортрет','Неоновый дождь','Алое платье']}}
function songReply(){var m=st.mem;m.want='song';var w=m.who;
 if(!w||!w.dat){m.ask='who';return{r:'a',t:w&&w.occ?'Для кого песня '+w.occ+'?':'Для кого и какой повод?',ch:['Маме на день рождения','Подруге на свадьбу','Папе на юбилей']}}
 var d=w.dat||'';return offerMsg('song',d?d.charAt(0).toUpperCase()+d.slice(1)+' — песню: её можно слушать снова и снова.':'Песню — её можно слушать снова и снова.')}
function videoReply(){var m=st.mem;m.want='video';
 if(!m.photo){m.ask='photo';return{r:'a',t:'Пришли фото — оживлю его. Скрепка слева.',ch:[{a:'clip',x:'Приложить фото'}]}}
 return offerMsg('video','Оживим твоё фото.')}
function voiceReply(){var m=st.mem;m.want='voice';return offerMsg('voice',m.last==='text'?'Озвучу текст выше.':'Озвучу любой текст голосом.')}
var CAP=['Свет, кадр и хорошее настроение.','Иногда достаточно одного кадра.','Сегодня — моё.'];
function textAsk(n,more){var m=st.mem;m.want='text';m.last='text';m.tq=n;m.tmore=!!more;
 return{r:'a',t:more?'Ещё вариант — снова 8 кр.':'Напишу — текст стоит 8 кр.',ch:[{a:'write',x:'Написать · 8 кр'}]}}
function textReply(n,more){var m=st.mem;m.want='text';m.tq=n;m.tv=more?((m.tv||0)+1)%3:(m.tv||0);var v=m.tv,w=m.who,p=[],cp;
 var topic=(n.match(/(?<![а-я])про\s+([^.,!?]{2,30})/)||[])[1];
 if(/подпис/.test(n)||(more&&m.tk==='cap')){m.tk='cap';p=[CAP[v]]}
 else if(/(?<![а-я])пост/.test(n)||(more&&m.tk==='post')){m.tk='post';if(topic)m.topic=topic.trim();var tp=m.topic;
  p=['Расскажем '+(tp?'про '+tp:'о главном')+'.',['Заходи сегодня — будем рады тебе.','Загляни к нам — всё самое интересное уже здесь.','Мы ждём тебя. Приходи и расскажи друзьям.'][v]]}
 else{m.tk='greet';var h=w&&w.hello?w.hello:'Поздравляю!';
  p=[(w&&w.nom?w.adj+' '+w.nom+'! ':'')+h,['Желаю, чтобы рядом были те, кто любит.','Пусть день будет тёплым, а мечты — ближе.','Тебе — тепло, а нам — повод собраться.'][v],['Спасибо, что ты есть.','Береги себя и улыбайся.','Пусть всё задуманное сбудется.'][v]]}
 cp=p.join('\n');m.last='text';m.ask=null;
 return{r:'a',t:p.join('\n'),cp:cp,cost:TXT_COST,post:1,ch:[{a:'again',x:'Ещё вариант · 8 кр'},'Озвучь это']}}
function priceReply(k){var m=st.mem,l=m.last,o=l&&OT[l],kd=k||(o&&o.kind)||(l==='text'?'text':m.want);
 var t;
 if(k&&o&&o.kind!==k&&!(k==='text'&&l==='text'))o=null;
 if(o){t=o.t+' — '+o.pr+'.';
  if(o.kind==='photo')t+=o.n>5?' Дешевле — тренды за 5 кр.':' Это самые доступные тренды.';
  else if(l==='video'||l==='dance')t+=' Дешевле — Grok Imagine 1.5, от 16 кр.';
  else if(l==='voice')t='Озвучка — 95 кр за 1000 знаков.'}
 else if(kd==='text'||(!k&&l==='text'))t='Текст — 8 кр, GPT-5.6 Luna.';
 else if(kd==='photo')t='Фото-тренды стоят от 5 до 13 кр.';
 else if(kd==='video')t='Оживить фото — от 23 кр, дешевле — от 16 кр.';
 else if(kd==='song')t='Песня в подарок — 23 кр.';
 else if(kd==='voice')t='Озвучка — 95 кр за 1000 знаков.';
 else return{r:'a',t:'Фото от 5 кр, песня 23 кр, видео от 23 кр. Что нужно?',ch:C3};
 return{r:'a',t:t}}
function creditsReply(){var m=st.mem,o=m.last&&OT[m.last],t=BAL+' кр, как в шапке.';
 if(o){if(o.n>BAL)t+=m.last==='voice'?' На озвучку 1000 знаков не хватит: нужно 95 кр.':' На «'+o.t+'» не хватит: нужно '+o.pr+'.';else{var q=Math.floor(BAL/o.n);t+=' На «'+o.t+'» хватит '+q+' '+plural(q)+'.'}}
 return{r:'a',t:t}}
function relReply(n,cheap){var m=st.mem,l=m.last,o=l&&OT[l],i,c,seen=m.seen||[];
 if(l==='text')return cheap?{r:'a',t:'Текст стоит 8 кр, дешевле нет.'}:textAsk(m.tq||n||'',true);
 if(!o){return{r:'a',t:'Дешевле чего? Скажи, что нужно.',ch:C3}}
 if(o.kind==='photo'){var cur=ph(l);
  if(cheap){c=PH.filter(function(p){return p.n<cur.n&&seen.indexOf(p.id)<0})[0]||PH.filter(function(p){return p.n<cur.n&&p.id!==l})[0];
   if(c)return photoOffer(c,'Есть дешевле — за '+c.n+' кр.');
   c=PH.filter(function(p){return p.n===cur.n&&seen.indexOf(p.id)<0})[0];
   if(c)return photoOffer(c,'Дешевле нет, 5 кр — минимум. Вот другой за 5 кр.');
   return{r:'a',t:'Дешевле нет: 5 кр — минимум для фото.',ch:['Другой стиль']}}
  c=PH.filter(function(p){return seen.indexOf(p.id)<0})[0];
  if(!c){m.seen=[l];c=PH.filter(function(p){return p.id!==l})[0]}
  return photoOffer(c,'Вот другой вариант.')}
 if(o.kind==='video'){
  if(l==='video'||l==='dance'){return offerMsg('video2',cheap?'Дешевле — Grok Imagine 1.5, от 16 кр.':'Другая модель — Grok Imagine 1.5.')}
  return cheap?{r:'a',t:'Дешевле нет: от 16 кр — самый доступный вариант.'}:offerMsg('video','Вернёмся к первому — от 23 кр.')}
 if(o.kind==='song')return{r:'a',t:'Песня в подарок стоит 23 кр, цена одна. Могу сменить адресата или повод.'};
 return{r:'a',t:'Озвучка — 95 кр за 1000 знаков, другой цены нет.'}}

function answer(raw,attach){var m=st.mem,n=norm(raw).replace(/\s+/g,' ').trim(),k,s,w,words;
 if(attach){m.photo=true;
  if(m.want==='video'||m.ask==='photo')return videoReply();
  if(m.want==='photo'){s=ph(m.style);return s?photoOffer(s,'Фото на месте. Сделаем «'+s.t+'».'):askStyle()}
  return{r:'a',t:'Фото на месте. Что с ним сделать?',ch:['Оживи моё фото','Фото в стиле кино']}}
 words=n.replace(/[^а-яa-z0-9 ]/g,'').split(' ').filter(Boolean);
 k=kindOf(n);
 if(/сколько у меня|баланс|кредит|сколько кр|сколько осталось/.test(n))return creditsReply();
 if(/сколько стоит|стоит|цена|цену|цены|почем|прайс|сколько это|сколько будет|сколько надо/.test(n))return priceReply(k);
 if(/что (ты )?(умеешь|можешь)|чем (ты )?(можешь )?помочь|что (ты )?делаешь|возможност|^помощь$|^помоги$/.test(n))
  return{r:'a',t:'Делаю фото, видео, песни, озвучку и тексты.\nЧто нужно?',ch:C3};
 if(/^(привет|здравств|добрый|доброе|хай|салют|hello|hi)/.test(n))
  return{r:'a',t:m.last&&OT[m.last]?'Привет! Продолжим с «'+OT[m.last].t+'» или начнём новое?':'Привет! Что сделаем?',ch:m.last?null:C3};
 if(words.length&&words.length<=3&&/^(да|давай|запускай|запусти|поехали|ок|окей|хочу|согласен|согласна|создавай|открывай|го)$/.test(words[0])&&!k){
  var o=m.last&&OT[m.last];
  if(o)return{r:'a',t:'Открываю',go:o.url};
  if(m.last==='text')return{r:'a',t:'Текст уже выше — нажми «Скопировать».'};
  return{r:'a',t:'Что именно сделать?',ch:C3}}
 if(/спасибо|благодар|супер|класс|отлично/.test(n)&&!k)return{r:'a',t:'Пожалуйста! Нужно ещё что-нибудь?'};
 if(/^(нет|не надо|не нужно|не хочу|отмена|стоп)(?![а-я])/.test(n))return{r:'a',t:'Хорошо. Скажи, если что-то понадобится.'};
 var cheap=/дешев|эконом/.test(n),other=/друго|(?<![а-я])еще(?![а-я])|иначе|вариант|смени|поменяй|не то/.test(n);
 if((cheap||other)&&(!k||(m.last&&OT[m.last]&&OT[m.last].kind===k)||(k==='text'&&m.last==='text')))return relReply(n,cheap);
 if(!k&&m.ask==='style'){s=styleOf(n);if(s)return photoOffer(s)}
 if(m.ask==='who'&&!k){w=parseWho(n);
  if(w)m.who=mergeWho(m.who,w);else if(n.length<=40&&words.length<=6&&!/\?/.test(n))m.who=mergeWho(m.who,{dat:raw.trim().replace(/^для\s+/i,''),raw:raw.trim()});
  if(w||m.who&&m.who.dat)return songReply()}
 w=parseWho(n);if(w&&(k==='song'||k==='text'||(!k&&(m.want==='song'||m.want==='text'))))m.who=mergeWho(m.who,w);
 if(k==='voice')return voiceReply();
 if(/ролик|сторис|рилс|reels/.test(n)&&!/оживи|оживл/.test(n)){m.want='video';return offerMsg('dance','Для соцсетей — «Ночной танец» из твоего фото.')}
 if(k==='video')return videoReply();
 if(k==='song')return songReply();
 if(k==='text')return textAsk(n,false);
 s=styleOf(n);
 if(k==='photo'||s){if(s)return photoOffer(s);return askStyle()}
 if(!k&&w&&m.want==='song')return songReply();
 if(!k&&w&&m.want==='text')return textAsk(n,false);
 return{r:'a',t:'Не понял. Что сделать?',ch:C3}}

var TIPS=[['Поздравить близкого','song'],['Оживить старое фото','photo'],['Сделать аватарку','spark'],['Ролик для соцсетей','kino']];
var ALT={song:function(){return[{t:'Текст поздравления',pr:'8 кр',act:'write',q:'поздравление'},{t:OT.video.t,pr:OT.video.pr,url:OT.video.url}]},video:function(){return[{t:OT.dance.t,pr:OT.dance.pr,url:OT.dance.url},{t:OT.spacecat.t,pr:OT.spacecat.pr,url:OT.spacecat.url}]},dance:function(){return[{t:OT.video.t,pr:OT.video.pr,url:OT.video.url},{t:OT.spacecat.t,pr:OT.spacecat.pr,url:OT.spacecat.url}]}};
PH.forEach(function(p){ALT[p.id]=function(){var o=[];['neon','anime','avatar','kino'].forEach(function(i){if(i!==p.id&&o.length<2){var q=ph(i);o.push({t:q.t,pr:q.n+' кр',url:TRU(q.id)})}});return o}});
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function bubble(t,cls){var b=el('div',cls||'sc-a');String(t).split('\n').forEach(function(s){b.appendChild(el('p',null,s))});return b}
function offerEl(id,w){var o=OT[id];if(!o)return null;var s=el('section','sc-offer');s.setAttribute('aria-label','Предложение');
 var top=el('div','sc-top'),th=el('span','sc-th'+(o.icon?' i':''));
 if(o.icon){th.innerHTML=STK[o.icon]}else{var im=el('img');im.src=o.img;im.alt='';im.style.objectPosition=o.pos;th.appendChild(im)}
 var inf=el('div','sc-info');inf.appendChild(el('b',null,o.t));inf.appendChild(el('span','m',id==='song'&&w?w:o.m));inf.appendChild(el('span','plate',o.pr));
 top.appendChild(th);top.appendChild(inf);s.appendChild(top);
 var a=el('a','cf-go','Создать · '+o.pr);a.href=o.url;if(o.pr.length>12)a.style.fontSize='15.5px';s.appendChild(a);return s}
function altsEl(id){var f=ALT[id];if(!f)return null;var w=el('div','cf-alts');f().forEach(function(x){var b;if(x.act){b=el('button','cf-alt');b.type='button';b.setAttribute('data-act',x.act);b.setAttribute('data-q',x.q)}else{b=el('a','cf-alt');b.href=x.url}b.appendChild(el('b',null,x.t));b.appendChild(el('small',null,x.pr));w.appendChild(b)});return w}
function avEl(){var a=el('span','cf-av');a.setAttribute('aria-hidden','true');a.innerHTML='<svg viewBox="0 0 38 34"><use href="#cf-hero"/></svg>';return a}
function markLast(){var l=feed.querySelectorAll('.cf-go');for(var i=0;i<l.length;i++)l[i].classList.toggle('old',i<l.length-1)}
function chipEls(list){var w=el('div','sc-chips');list.forEach(function(c){var b=el('button','sc-chip',typeof c==='string'?c:c.x);b.type='button';
 if(typeof c==='string')b.setAttribute('data-send',c);else b.setAttribute('data-act',c.a);w.appendChild(b)});return w}
function copyBtn(text){var b=el('button','sc-copy','Скопировать');b.type='button';b.setAttribute('data-copy',text);return b}
function renderMsg(x){
 if(x.r==='u'){var u=el('div','sc-u');
  if(x.ph){var im=el('img');im.src='img/mira-'+(((x.ph-1)%5)+1)+'.jpg';im.alt='Приложенное фото';u.appendChild(im);u.appendChild(el('span',null,'Фото добавлено'))}
  else u.textContent=x.t;return u}
 var g=el('div','sc-g cf-g'),col=el('div','cf-col');g.appendChild(avEl());g.appendChild(col);
 if(x.t)col.appendChild(bubble(x.t,x.post?'sc-a sc-post':'sc-a'));
 if(x.cost)col.appendChild(el('p','sc-cost',x.cost));
 if(x.o){var oe=offerEl(x.o,x.w);if(oe){col.appendChild(oe);var ae=altsEl(x.o);if(ae)col.appendChild(ae)}}
 if(x.cp||(x.ch&&x.ch.length)){var cw=(x.ch&&x.ch.length)?chipEls(x.ch):el('div','sc-chips');if(x.cp)cw.insertBefore(copyBtn(x.cp),cw.firstChild);col.appendChild(cw)}
 return g}
var burst,greet,tips;
function buildHead(){
 burst=el('div','sc-burst');burst.innerHTML='<svg class="b" viewBox="0 0 38 34" fill="none" stroke="#29262a" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke-width="1.55" fill="#f5dc73" d="m18.8 1.6 3.8 2.7 5.3-.6 1.7 4.3 4.7 2.1-.4 4.6 2.6 4-3.2 3.6-.4 4.7-5 .9-2.8 3.9-5.2-1.5-4.7 2-3.8-3.3-5.2-.3-1.3-4.5-3.8-2.9 1.5-4.3-1.5-4.5 4-2.8 1.2-4.7 5.2-.3Z"/></svg><svg class="g" viewBox="86 98 482 465" aria-hidden="true"><defs><mask id="sc-mark" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="640"><image href="img/8420d4d8.jpg" width="640" height="640"/></mask></defs><rect width="640" height="640" fill="currentColor" mask="url(#sc-mark)"/></svg>';
 greet=el('div','sc-g cf-g');greet.appendChild(avEl());var gc=el('div','cf-col');gc.appendChild(bubble('Привет! С чем помочь?\nСкажи задачу — подберу, чем сделать и сколько стоит.'));greet.appendChild(gc);
 tips=el('div','sc-tips');TIPS.forEach(function(t){var b=el('button','sc-tip');b.type='button';b.setAttribute('data-send',t[0]);
  var ic=el('span','ic');ic.innerHTML=STK[t[1]];b.appendChild(ic);b.appendChild(document.createTextNode(t[0]));tips.appendChild(b)})}
function stick(){feed.scrollTop=feed.scrollHeight}
function draw(){feed.textContent='';buildHead();var any=st.m.length>0;
  feed.appendChild(greet);
 st.m.forEach(function(x){feed.appendChild(renderMsg(x))});
 if(!any)feed.appendChild(tips);
 newBox.hidden=!any;resetNew();markLast();stick()}
function add(x){var first=st.m.length===0;st.m.push(x);save();
 if(first){if(burst.parentNode)burst.parentNode.removeChild(burst);if(tips.parentNode)tips.parentNode.removeChild(tips);newBox.hidden=false}
 feed.appendChild(renderMsg(x));markLast();stick()}

function typing(){var g=el('div','sc-g cf-g');var c=el('div','cf-col');var b=el('div','sc-a');var d=el('div','sc-dots');d.innerHTML='<i></i><i></i><i></i>';b.appendChild(d);c.appendChild(b);g.appendChild(avEl());g.appendChild(c);g.setAttribute('aria-label','Помощник печатает');feed.appendChild(g);stick();return g}
function respond(raw,attach){busy=true;var tg=typing();
 setTimeout(function(){var r;try{r=answer(raw,attach)}catch(e){r={r:'a',t:'Не понял. Что сделать?',ch:C3}}
  if(tg.parentNode)tg.parentNode.removeChild(tg);
  var go=r.go;delete r.go;
  if(r.ch===null)delete r.ch;
  add(r);busy=false;
  if(go)setTimeout(function(){window.chatGo(go)},700)},600+Math.floor(Math.random()*300))}
function send(text){text=String(text||'').trim();if(!text||busy)return false;
 add({r:'u',t:text.slice(0,400)});respond(text,false);return true}
function runText(more,q){if(busy)return;var m=st.mem;if(q!=null){m.tq=q;more=false}busy=true;var tg=typing();setTimeout(function(){var r=textReply(m.tq||'',!!more);if(tg.parentNode)tg.parentNode.removeChild(tg);add(r);busy=false},600+Math.floor(Math.random()*300))}
function attachPhoto(){if(busy)return;var m=st.mem;m.pc=(m.pc||0)+1;add({r:'u',ph:m.pc});respond('',true)}

/* ---------- события ---------- */
function fit(){field.style.height='52px';var h=Math.min(104,Math.max(52,field.scrollHeight));field.style.height=h+'px'}
form.addEventListener('submit',function(e){e.preventDefault();if(send(field.value)){field.value='';fit()}});
field.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit?form.requestSubmit():form.dispatchEvent(new Event('submit',{cancelable:true}))}});
field.addEventListener('input',fit);
$('send').addEventListener('pointerdown',function(e){if(document.activeElement===field)e.preventDefault()});
clip.addEventListener('click',attachPhoto);
feed.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-send'))send(t.getAttribute('data-send'));
 else if(t.getAttribute('data-act')==='write')runText(st.mem.tmore,t.hasAttribute('data-q')?t.getAttribute('data-q'):null);
 else if(t.getAttribute('data-act')==='again')runText(true);
 else if(t.getAttribute('data-act')==='clip')attachPhoto();
 else if(t.hasAttribute('data-copy')){var tx=t.getAttribute('data-copy'),done=function(){t.textContent='Скопировано';t.classList.add('ok');setTimeout(function(){t.textContent='Скопировать';t.classList.remove('ok')},1500)};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(done,function(){fallback(tx,done)})}else fallback(tx,done)}catch(er){fallback(tx,done)}}});
function fallback(tx,done){try{var a=document.createElement('textarea');a.value=tx;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a)}catch(e){}done()}
function resetNew(){clearTimeout(askT);newBox.className='sc-new';newBox.innerHTML='';var b=el('button',null,'Заново');b.type='button';b.id='newb';newBox.appendChild(b)}
newBox.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.id==='newb'){clearTimeout(askT);newBox.className='sc-new ask';newBox.innerHTML='';
  var a=el('button',null,'Стереть?');a.type='button';a.id='newc';var y=el('button',null,'Да');y.type='button';y.id='newy';newBox.appendChild(a);newBox.appendChild(y);
  askT=setTimeout(resetNew,4000)}
 else if(t.id==='newc')resetNew();
 else if(t.id==='newy'){st={m:[],mem:{}};wipe();busy=false;draw()}});

function layout(){var vv=window.visualViewport,ih=window.innerHeight,h=vv?vv.height:ih,kb=(ih-h>120)||h<520,near=feed.scrollHeight-feed.scrollTop-feed.clientHeight<80;

if(qm){try{qq=decodeURIComponent(qm.replace(/\+/g,' ')).trim()}catch(e){}}

draw();layout();
if(qq){send(qq)}else{var last=st.m[st.m.length-1];if(last&&last.r==='u')respond(last.ph?'':last.t,!!last.ph)}
})();
