function rowEl(x,i,prev,pink,isNew){
 if(x.r==='s')return el('div','cd-strip',x.t);
 var first=prev!==x.r,row=el('div','cd-row '+x.r+(first?' first':'')+(isNew?' new':''));
 if(x.r==='u'){var b;
  if(x.ph){b=el('div','cd-b ph');var im=el('img');im.src='img/mira-'+(((x.ph-1)%5)+1)+'.jpg';im.alt='Моё фото';b.appendChild(im);b.appendChild(el('span',null,'Моё фото'))}
  else b=bubble(x.t);
  row.appendChild(b);row.appendChild(avMe(!first));return row}
 row.appendChild(avCh(!first));
 var col=el('div','cd-col');row.appendChild(col);
 if(x.t)col.appendChild(bubble(x.t,x.post?'post':''));
 if(x.set){var old=i!==pink;col.appendChild(cardEl(x.set.m,old,!!x.done,i));
  if(x.set.a.length)col.appendChild(altsEl(x.set.a,!!x.done,i));
  if(x.more&&!old){var mb=el('button','cd-more');mb.type='button';mb.setAttribute('data-act','more');mb.appendChild(document.createTextNode('Не то?'));mb.appendChild(el('span',null,'Расскажи подробнее'));col.appendChild(mb)}}
 if(x.ch){var nx=st.m[i+1];col.appendChild(chipsEl(x.ch,!!nx,nx&&(nx.v||nx.t)))}
 if(x.cp){var cw=el('div','cd-chips'),cb=el('button','cd-chip cd-copy','Скопировать'),ag=el('button','cd-chip','Ещё вариант · '+CAT.text.p);
  cb.type='button';cb.setAttribute('data-copy',x.cp);ag.type='button';ag.setAttribute('data-act','write');ag.setAttribute('data-i','x');cw.appendChild(cb);cw.appendChild(ag);col.appendChild(cw)}
 if(x.topup){var ta=el('a','cd-go'+(i!==pink?' old':''),'Пополнить');ta.href='../sk-profile-money/topup.html';col.appendChild(ta)}
 return row}
function pinkIdx(){for(var i=st.m.length-1;i>=0;i--){if(st.m[i].set||st.m[i].topup)return i}return-1}
function pending(){return!!(st.pend&&st.m.length&&st.m[st.m.length-1].ch)}
function paint(){var pk=pinkIdx(),prev='';feed.textContent='';
 st.m.forEach(function(x,i){feed.appendChild(rowEl(x,i,prev,pk,i===newIdx));prev=x.r});
 newIdx=-1;newB.hidden=st.m.length<=1;
 balEl.textContent=st.bal+' кр';
 balEl.parentNode.setAttribute('aria-label','Баланс '+st.bal+' кредитов, пополнить');
 field.placeholder=pending()?'Или напиши своё':'Напиши, что нужно'}
function stick(toTop){var rows=feed.querySelectorAll('.cd-row'),last=rows[rows.length-1];
 if(toTop&&last&&last.offsetHeight>feed.clientHeight-24)feed.scrollTop=last.offsetTop-feed.offsetTop-8;else feed.scrollTop=feed.scrollHeight}
function add(x){st.m.push(x);newIdx=st.m.length-1;save();paint();stick(!!x.set)}

/* ---------- действия ---------- */
function typing(){var lm=st.m[st.m.length-1],cont=lm&&lm.r==='c',g=el('div','cd-row c'+(cont?'':' first')),col=el('div','cd-col'),b=el('div','cd-b'),d=el('div','cd-dots');
 d.innerHTML='<i></i><i></i><i></i>';b.appendChild(d);col.appendChild(b);g.appendChild(avCh(cont));g.appendChild(col);g.setAttribute('aria-label','Chappy печатает');feed.appendChild(g);feed.scrollTop=feed.scrollHeight;return g}
function delay(fn){busy=true;var tg=typing();
 setTimeout(function(){if(tg.parentNode)tg.parentNode.removeChild(tg);try{fn()}catch(e){add({r:'c',t:'Не вышло, попробуй ещё раз.'})}busy=false},520+Math.floor(Math.random()*280))}
function respond(txt,val,photo){delay(function(){add(answer(txt,val,photo))})}
function say(txt,val){txt=String(txt||'').trim();if(!txt||busy)return false;
 var u={r:'u',t:txt.slice(0,400)};if(val)u.v=val;st.m.push(u);save();paint();stick();respond(txt,val,false);return true}
function attach(){if(busy)return;st.pc=(st.pc||0)+1;st.m.push({r:'u',ph:st.pc});save();paint();stick();respond('',null,true)}
function doWrite(i){if(busy)return;var x=st.m[+i];
 if(x&&x.done)return;
 if(st.bal<PRICE_T){add({r:'c',t:'Не хватает кредитов: на текст нужно '+CAT.text.p+', на счёте '+st.bal+' кр.',topup:1});return}
 if(x&&x.set)x.done=true;
 st.bal-=PRICE_T;var v=st.tv;st.tv=v+1;save();paint();
 delay(function(){st.m.push({r:'s',t:'Списано '+CAT.text.p+' · GPT-5.6 Luna'});var a=writeText(v);add({r:'c',t:a.join('\n'),post:1,cp:a.join('\n')})})}
function doMore(){if(busy)return;st.m.push({r:'u',t:'Не то'});save();paint();stick();delay(function(){add(moreQ());field.focus()})}
function reset(){clearTimeout(askT);st=fresh();wipe();busy=false;paint();stick()}

/* ---------- события ---------- */
function fit(){field.style.height='48px';field.style.height=Math.min(104,Math.max(48,field.scrollHeight))+'px'}
form.addEventListener('submit',function(e){e.preventDefault();if(say(field.value,null)){field.value='';fit()}});
field.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(form.requestSubmit)form.requestSubmit();else form.dispatchEvent(new Event('submit',{cancelable:true}))}});
field.addEventListener('input',fit);
$('send').addEventListener('pointerdown',function(e){if(document.activeElement===field)e.preventDefault()});
clip.addEventListener('click',attach);
function copyFallback(tx,done){try{var a=document.createElement('textarea');a.value=tx;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a)}catch(e){}done()}
feed.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-own')){field.focus();return}
 if(t.hasAttribute('data-v')){say(t.getAttribute('data-x'),t.getAttribute('data-v'));return}
 var a=t.getAttribute('data-act');
 if(a==='write')doWrite(t.getAttribute('data-i'));
 else if(a==='more')doMore();
 else if(t.hasAttribute('data-copy')){var tx=t.getAttribute('data-copy'),done=function(){t.textContent='Скопировано';t.classList.add('ok');setTimeout(function(){t.textContent='Скопировать';t.classList.remove('ok')},1500)};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(done,function(){copyFallback(tx,done)})}else copyFallback(tx,done)}catch(er){copyFallback(tx,done)}}});
function resetNew(){clearTimeout(askT);newB.textContent='Заново';newB.classList.remove('ask')}
newB.addEventListener('click',function(){if(newB.classList.contains('ask')){reset();resetNew();return}
 newB.textContent='Стереть?';newB.classList.add('ask');askT=setTimeout(resetNew,3500)});

/* ---------- высота под клавиатуру ---------- */
function layout(){var vv=window.visualViewport,ih=window.innerHeight,h=vv?vv.height:ih,near=feed.scrollHeight-feed.scrollTop-feed.clientHeight<80;
 app.style.setProperty('--cd-h',Math.round(h)+'px');
 app.style.transform=(vv&&vv.offsetTop>0)?'translateY('+Math.round(vv.offsetTop)+'px)':'';
 if(near)feed.scrollTop=feed.scrollHeight}
window.addEventListener('resize',layout);
if(window.visualViewport){window.visualViewport.addEventListener('resize',layout);window.visualViewport.addEventListener('scroll',layout)}
field.addEventListener('focus',function(){setTimeout(function(){window.scrollTo(0,0);layout();feed.scrollTop=feed.scrollHeight},250)});

/* ---------- старт ---------- */
var qm=(location.search.match(/[?&]q=([^&]*)/)||[])[1],qq='';
if(qm){try{qq=decodeURIComponent(qm.replace(/\+/g,' ')).trim()}catch(e){}}
if(qq){st=fresh();wipe();try{history.replaceState(null,'',location.pathname)}catch(e){}}else st=load()||fresh();
paint();layout();stick();
window.cdDialog={get st(){return st},put:function(o){st=o;paint();stick()},fresh:fresh};
if(qq){say(qq,null)}else{var lm=st.m[st.m.length-1];if(lm&&lm.r==='u'){respond(lm.ph?'':lm.t,lm.v||null,!!lm.ph)}}
})();
</script>
</body></html>
