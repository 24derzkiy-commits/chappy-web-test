<script>
const items={"kino": {"type": "Фото", "title": "Кинопортрет", "src": "img/kino.jpg", "alt": "Кинопортрет мужчины на вечерней улице", "summary": "Одно твоё фото — и ты в кадре ночного кино.", "price": "13 кр"}, "neon": {"type": "Фото", "title": "Неоновый дождь", "src": "img/neon.jpg", "alt": "Портрет в розовом и синем неоновом свете", "summary": "Примерь свет неоновых вывесок на своём фото.", "price": "5 кр"}, "fashion": {"type": "Фото", "title": "Алое платье", "src": "img/fashion.jpg", "alt": "Девушка в алом платье", "summary": "Твоё фото в образе с модной съёмки.", "price": "13 кр"}, "motion": {"type": "Видео", "title": "Оживить фото", "src": "img/motion.jpg", "alt": "Пример кадра для анимации портрета", "summary": "Преврати один снимок в короткое видео.", "price": "от 23 кр"}, "future": {"type": "Видео", "title": "Город будущего", "src": "img/future.jpg", "alt": "Город будущего", "summary": "Сними короткое видео со своим фото в городе будущего.", "price": "159 кр"}, "song": {"type": "Песни", "title": "Песня в подарок", "src": "img/tr-retro.jpg", "alt": "Улыбающаяся девушка на солнце", "summary": "Придумай повод, выбери настроение и посвяти песню близкому.", "price": "23 кр"}};
const sections={Все:['kino','neon','fashion','motion','future','song'],Фото:['kino','neon','fashion'],Видео:['motion','future'],Песни:['song']};
let section='Все',current='kino';
const el=id=>document.getElementById(id);
const two=n=>String(n).padStart(2,'0');
function show(key){
  current=key;const item=items[key],keys=sections[section],at=keys.indexOf(key);
  document.querySelector('.feature').dataset.style=key;
  el('cover').src=item.src;el('cover').alt=item.alt;el('kind').textContent=item.type;
  el('name').textContent=item.title;el('summary').textContent=item.summary;el('price').textContent=item.price;
  document.querySelector('.pager').hidden=keys.length===1;el('pos').textContent=two(at+1)+' / '+two(keys.length);
  const others=keys.slice(at+1).concat(keys.slice(0,at));
  document.querySelector('.more').hidden=!others.length;
  el('others-title').textContent=section==='Все'?'Ещё тренды':'Ещё в разделе';
  el('options').replaceChildren(...others.map(k=>{
    const b=document.createElement('button'),t=document.createElement('span'),img=document.createElement('img'),n=document.createElement('span'),name=document.createElement('strong'),price=document.createElement('em');
    b.className='option';b.type='button';t.className='thumb';n.className='num';n.textContent=two(keys.indexOf(k)+1);
    img.src=items[k].src;img.alt='';name.textContent=items[k].title;price.textContent=items[k].price;
    t.append(img,n);b.append(t,name,price);b.onclick=()=>{show(k);el('options').scrollLeft=0};return b}));
}
function step(d){const keys=sections[section];show(keys[(keys.indexOf(current)+d+keys.length)%keys.length])}
el('prev').onclick=()=>step(-1);el('fwd').onclick=()=>step(1);
let x0=null;const print=document.querySelector('.print');
print.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
print.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)step(dx<0?1:-1)});
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{section=b.textContent;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',String(b===x)));show(sections[section][0])});
el('create').onclick=()=>{const item=items[current],song=current==='song';el('dialog-title').textContent=item.title;el('dialog-copy').textContent=song?'Опиши, для кого и по какому поводу пишем песню.':'Выбери одно фото, чтобы начать.';el('photo-pick').hidden=song;el('song-text').hidden=!song;el('next').showModal()};
el('next').querySelector('.close').onclick=()=>el('next').close();
document.querySelectorAll('.pin[data-go]').forEach(b=>b.onclick=()=>{section='Все';document.querySelectorAll('.filters button').forEach((x,i)=>x.setAttribute('aria-pressed',String(i===0)));show(b.dataset.go)});
const q=new URLSearchParams(location.search).get('show');show(items[q]?q:'kino');
</script><script>(()=>{const n=+new URLSearchParams(location.search).get('tab');const d=[...document.querySelectorAll('.newdock .dest')];d.forEach((b,i)=>{b.onclick=()=>d.forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'))});if(d[n])d[n].click()})()</script></body></html>
