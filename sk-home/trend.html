<script>
const KIND={"Фото": "<svg viewBox=\"0 0 16 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M1 1h14v12H1zM2 11l4-4 3 2 2-3 3 4\"/><circle cx=\"5\" cy=\"4.5\" r=\".9\" fill=\"currentColor\"/></svg>", "Видео": "<svg viewBox=\"0 0 16 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M1 2.5h9.5v9H1zM10.5 6l4.5-2.5v7L10.5 8\"/></svg>", "Песни": "<svg viewBox=\"0 0 16 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M6 11V2l8-1.5v9\"/><circle cx=\"4\" cy=\"11\" r=\"2\" fill=\"currentColor\"/><circle cx=\"12\" cy=\"9.5\" r=\"2\" fill=\"currentColor\"/></svg>"};
const MUTE='<svg viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.5h3L9 2v12L5 10.5H2z" fill="currentColor"/><path d="M12 5.5l4 5M16 5.5l-4 5"/></svg>';
const SOUND='<svg viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.5h3L9 2v12L5 10.5H2z" fill="currentColor"/><path d="M12 5.2c1.2 1.6 1.2 4 0 5.6M14.4 3.2c2.2 2.8 2.2 6.8 0 9.6"/></svg>';
/* песня звучит только по нажатию; источник один; уход с карточки или с экрана — тишина */
let live=null;
function songUI(slide,on){const b=slide.querySelector('.td-play');if(!b)return;b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Пауза':'Слушать');b.querySelector('.td-pl-t').textContent=on?'Пауза':'Слушать';slide.classList.toggle('playing',on)}
function songBar(slide,a){const i=slide.querySelector('.td-prog i');if(i)i.style.transform='scaleX('+(a&&a.duration>0&&isFinite(a.duration)?Math.min(1,a.currentTime/a.duration):0)+')'}
function stopAudio(){if(!live)return;const{a,slide}=live;live=null;try{a.pause();a.currentTime=0}catch(e){}songUI(slide,false);songBar(slide,null)}
function toggleSong(slide){
  const a=slide.querySelector('audio');if(!a||!a.getAttribute('src'))return;
  if(live&&live.a===a&&!a.paused){a.pause();songUI(slide,false);return}
  if(!live||live.a!==a)stopAudio();
  live={a,slide};songUI(slide,true);
  const p=a.play();if(p&&p.catch)p.catch(()=>{if(live&&live.a===a){live=null;songUI(slide,false)}});
}
function setSound(slide,on){const v=slide.querySelector('video'),b=slide.querySelector('.td-snd-btn');if(!v||!b)return;v.muted=!on;if(on)v.play().catch(()=>{});b.innerHTML=on?SOUND:MUTE;b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Выключить звук':'Включить звук')}
const items=[{"k": "neon", "type": "Фото", "title": "Неоновый дождь", "src": "img/neon.jpg", "alt": "Портрет в розовом и синем неоновом свете", "price": "5 кр", "pos": "50% 35%", "dx": "1.5%"}, {"k": "motion", "type": "Видео", "title": "Оживить фото", "src": "img/clip-spin-poster.jpg", "alt": "Девушка в соборе, волосы развеваются", "price": "от 23 кр", "pos": "47% 50%", "hot": 1, "video": "img/clip-spin.mp4"}, {"k": "spacecat", "type": "Видео", "title": "Кот в космосе", "src": "img/clip-spacecat-poster.jpg", "alt": "Кот в скафандре среди звёзд", "price": "от 23 кр", "pos": "50% 30%", "mute": 1, "video": "img/clip-spacecat.mp4"}, {"k": "avatar", "type": "Фото", "title": "Деловой портрет", "src": "img/tr-avatar.jpg", "alt": "Девушка в тёмном жакете на синем фоне", "price": "13 кр", "pos": "50% 22%", "dx": "-1.5%"}, {"k": "song", "type": "Песни", "title": "Песня в подарок", "src": "img/clip-sing-poster.jpg", "alt": "Девушка поёт в соборе со свечами", "price": "23 кр", "pos": "50% 30%", "video": "img/clip-sing.mp4", "audio": "img/song-birthday.mp3"}, {"k": "retro", "type": "Фото", "title": "Жаркое лето", "src": "img/tr-retro.jpg", "alt": "Улыбающаяся девушка на солнце у машины", "price": "5 кр", "pos": "50% 25%", "dx": "-1.5%"}, {"k": "anime", "type": "Фото", "title": "Закатный ветер", "src": "img/tr-anime.jpg", "alt": "Девушка с длинными волосами на закате у моря", "price": "5 кр", "pos": "50% 22%", "dx": "1.5%"}, {"k": "sport", "type": "Видео", "title": "На старте", "src": "img/clip-sport-poster.jpg", "alt": "Бегун на старте на стадионе", "price": "от 23 кр", "pos": "50% 25%", "mute": 1, "video": "img/clip-sport.mp4"}, {"k": "future", "type": "Видео", "title": "Город будущего", "src": "img/clip-future-poster.jpg", "alt": "Город будущего", "price": "159 кр", "pos": "50% 40%", "mute": 1, "video": "img/clip-future.mp4"}, {"k": "love", "type": "Песни", "title": "Моё место рядом с тобой", "src": "img/ava-hero.jpg", "alt": "Девушка в чёрном платье под дождём, фонари", "price": "23 кр", "pos": "50% 25%", "dx": "1.5%", "audio": "img/song-love.mp3"}, {"k": "kino", "type": "Фото", "title": "Кинопортрет", "src": "img/kino.jpg", "alt": "Кинопортрет мужчины на вечерней улице", "price": "13 кр", "pos": "58% 30%", "hot": 1, "dx": "-1.5%"}, {"k": "fashion", "type": "Фото", "title": "Алое платье", "src": "img/fashion.jpg", "alt": "Девушка в алом платье", "price": "13 кр", "pos": "50% 40%", "dx": "-1.5%"}, {"k": "dance", "type": "Видео", "title": "Ночной танец", "src": "img/clip-dance-poster.jpg", "alt": "Танцующая девушка в синем свете", "price": "от 23 кр", "pos": "50% 25%", "mute": 1, "video": "img/clip-dance.mp4"}, {"k": "gothic", "type": "Фото", "title": "Тёмная готика", "src": "img/tr-gothic.jpg", "alt": "Девушка в чёрном бархате, дым и свечи", "price": "13 кр", "pos": "45% 22%", "dx": "1.5%"}, {"k": "star", "type": "Фото", "title": "Красная дорожка", "src": "img/tr-star.jpg", "alt": "Девушка в блестящем платье на красной дорожке", "price": "13 кр", "pos": "55% 22%", "dx": "1.5%"}, {"k": "summer", "type": "Песни", "title": "Этим летом мы вдвоём", "src": "img/mira-4.jpg", "alt": "Улыбающаяся девушка, волосы на ветру", "price": "23 кр", "pos": "50% 22%", "dx": "-1.5%", "audio": "img/song-summer.mp3"}];
const $=s=>document.querySelector(s),lane=$('#lane'),dots=$('#dots'),hint=$('#hint'),cta=$('#create'),priceEl=$('#price');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
let cur=-1,step=1;
const slides=items.map(it=>{
  const a=document.createElement('article');a.className='td-slide';a.dataset.k=it.k;
  const media=it.video
    ?`<video class="td-media" muted playsinline loop ${reduce.matches?'':'autoplay'} preload="metadata" poster="${it.src}" aria-label="${it.alt}" style="object-position:${it.pos}"><source data-clip="${it.video}" type="video/mp4"></video>`
    :`<img class="td-media td-img" src="${it.src}" alt="${it.alt}" style="object-position:${it.pos};--dx:${it.dx||'0%'}">`;
  const PLAY='<svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15M17 4.5v15" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="butt"/></svg>';
  const snd=it.audio?'':(it.video&&!it.mute?`<button type="button" class="td-snd td-snd-btn" aria-pressed="false" aria-label="Включить звук">${MUTE}</button>`:((it.mute||it.type!=='Фото')?`<span class="td-snd" role="img" aria-label="Без звука">${MUTE}</span>`:''));
  const play=it.audio?`<button type="button" class="td-play" aria-pressed="false" aria-label="Слушать">${PLAY}<span class="td-pl-t">Слушать</span></button><audio preload="none" data-audio="${it.audio}"></audio>`:'';
  a.innerHTML=`<div class="td-frame">${media}<span class="td-tags"><span class="td-kt">${KIND[it.type]}<span>${it.type==='Песни'?'Песня':it.type}</span></span>${it.hot?'<span class="td-hot2">В тренде</span>':''}</span>${snd}${play}<div class="td-plate"><h2>${it.title}</h2>${it.audio?'<span class="td-prog"><i></i></span>':''}</div></div>`;
  if(it.audio)a.classList.add('is-song');
  a.querySelectorAll('source[data-clip]').forEach(x=>{x.src=x.dataset.clip;x.parentNode.load()});
  a.querySelectorAll('audio[data-audio]').forEach(x=>{x.src=x.dataset.audio});
  a.it=it;lane.append(a);return a;
});
slides.forEach(sl=>{const a=sl.querySelector('audio');if(!a)return;
  a.addEventListener('timeupdate',()=>songBar(sl,a));
  a.addEventListener('ended',()=>{if(live&&live.a===a)live=null;a.currentTime=0;songUI(sl,false);songBar(sl,null)});
  a.addEventListener('error',()=>{if(live&&live.a===a)live=null;songUI(sl,false)});
});
const N=slides.length;
function size(){const h=lane.clientHeight,s=Math.max(200,h-11);lane.style.setProperty('--s',s+'px');document.querySelector('.td-wrap').style.setProperty('--s',s+'px');step=s+11}
if(N>8){dots.classList.add('scale');dots.innerHTML='<b></b>';dots.firstChild.style.height=(100/N)+'%'}
else dots.replaceChildren(...Array.from({length:N},()=>document.createElement('i')));
function setCur(i,force){
  i=Math.max(0,Math.min(N-1,i));if(i===cur&&!force)return;const changed=i!==cur;cur=i;
  slides.forEach(s=>s.classList.remove('cur'));
  const s=slides[i];s.classList.add('cur');
  if(N>8){dots.firstChild.style.top=(100*i/N)+'%'}else [...dots.children].forEach((d,j)=>d.className=j===i?'on':'');
  priceEl.textContent=s.it.price;priceEl.classList.remove('pop');void priceEl.offsetWidth;priceEl.classList.add('pop');
  cta.href=s.it.type==='Песни'?'../sk-home-create/song.html':'../sk-home-create/photo.html';
  cta.setAttribute('aria-label','Создать, '+s.it.title+', '+s.it.price);
  if(changed)stopAudio();
  slides.forEach(x=>{if(x!==s||changed)setSound(x,false);const m=x.querySelector('video');if(!m)return;if(x===s&&!reduce.matches){m.play().catch(()=>{})}else{m.pause()}});
}
lane.addEventListener('click',e=>{const pl=e.target.closest('.td-play');if(pl){e.preventDefault();e.stopPropagation();toggleSong(pl.closest('.td-slide'));return}
  const b=e.target.closest('.td-snd-btn');if(!b)return;e.preventDefault();e.stopPropagation();setSound(b.closest('.td-slide'),b.getAttribute('aria-pressed')!=='true')});
function goto(i,smooth=true){
  i=Math.max(0,Math.min(N-1,i));
  lane.scrollTo({top:i*step,behavior:smooth&&!reduce.matches?'smooth':'auto'});
  if(!smooth||reduce.matches)setCur(i);
}
const dismissHint=()=>hint&&hint.classList.add('gone');
let raf=0;
lane.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{if(lane.scrollTop>8)dismissHint();setCur(Math.round(lane.scrollTop/step))})},{passive:true});
addEventListener('keydown',e=>{
  if(['ArrowDown','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();dismissHint();goto(cur+1)}
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();dismissHint();goto(cur-1)}
});
/* мышь: перетаскивание (касание листается самим браузером) */
let drag=null;
lane.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('.td-snd-btn,.td-play'))return;drag={y:e.clientY,t:lane.scrollTop,start:cur};lane.setPointerCapture(e.pointerId);lane.classList.add('drag')});
lane.addEventListener('pointermove',e=>{if(!drag)return;lane.scrollTop=drag.t-(e.clientY-drag.y)});
function endDrag(e){
  if(!drag)return;const dy=e.clientY-drag.y,d=drag;drag=null;lane.classList.remove('drag');dismissHint();
  let i=Math.round(lane.scrollTop/step);if(Math.abs(dy)>40)i=d.start+(dy<0?1:-1);
  lane.style.scrollSnapType='none';lane.scrollTo({top:Math.max(0,Math.min(N-1,i))*step,behavior:'smooth'});
  setTimeout(()=>{lane.style.scrollSnapType=''},450);
}
lane.addEventListener('pointerup',endDrag);lane.addEventListener('pointercancel',endDrag);
function fromHash(){const k=decodeURIComponent(location.hash.slice(1));const i=slides.findIndex(s=>s.dataset.k===k);return i<0?0:i}
new ResizeObserver(()=>{const keep=Math.max(cur,0);size();lane.scrollTo({top:keep*step,behavior:'auto'})}).observe(lane);
size();{const i=fromHash();lane.scrollTop=i*step;setCur(i,true);if(i>0)dismissHint()}
addEventListener('hashchange',()=>{const i=fromHash();goto(i,false)});
reduce.addEventListener&&reduce.addEventListener('change',()=>setCur(cur,true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();setCur(cur,true)});addEventListener('pagehide',stopAudio);
</script><script>(()=>{const n=+new URLSearchParams(location.search).get('tab');const d=[...document.querySelectorAll('.newdock .dest')];d.forEach((b,i)=>{b.onclick=()=>d.forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'))});if(d[n])d[n].click()})()</script></body></html>
